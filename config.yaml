judge:
  display: 裁判模型
  name: deepseek-v4-pro
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY
  price_in: 1.0
  price_out: 2.0
embedding_hub: BAAI/bge-m3
embedding_local: models/bge-m3
ragas_metrics:
- Faithfulness
- AnswerCorrectness
- ContextRecall
ragas_batch_size: 6
top_k: 6
chunk_size: 700
min_chunk_chars: 80
answer_temperature: 0.2
include_options_in_prompt: true
answer_max_tokens: 2000
chunk_filter:
  drop_reference_sections: false
  reference_score_threshold: 10
  reference_score_threshold_in_section: 7
  ref_penalty: 0.01
  audit_samples: 5
paths:
  pdfs: pdfs
  chunks: kb/chunks.jsonl
  emb: kb/emb.npy
  doc_index: kb/doc_index.json
  candidates: qa/candidates.jsonl
  review_csv: qa/审核表.csv
  qa_set: qa/qa_set.jsonl
  mcq_dir: qa/mcq
  runs: runs
  outputs: outputs
mcq_subset: nsclc
question_prefix: NSCLC
